<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Napoleon: Naval Empire</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Georgia', serif;
            background-color: #0a1622;
            color: #f5f5f5;
        }
        #gameCanvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Dynamic Sizing
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Palette
        const CLR_OCEAN = '#12263a';
        const CLR_WAVE = '#183048';
        const CLR_GOLD = '#daa520';
        const CLR_HUD_BG = '#0f141c';
        const CLR_HUD_BORDER = '#c5a059';
        const CLR_WHITE = '#f5f5f5';
        const CLR_WOOD = '#654321';
        const CLR_SAIL = '#f0ebd8';
        const CLR_FRENCH = '#183572';
        const CLR_BRITISH = '#b22222';

        // Engine State
        let gameState = 'MENU'; // MENU, SHOP, PLAY
        let selectedShip = null;
        let mouseX = 0, mouseY = 0;

        // Camera System
        const camera = {
            shakeIntensity: 0,
            shakeDuration: 0,
            dx: 0,
            dy: 0,
            triggerShake(intensity, duration) {
                if (intensity > this.shakeIntensity) {
                    this.shakeIntensity = intensity;
                    this.shakeDuration = duration;
                }
            },
            update() {
                if (this.shakeDuration > 0) {
                    this.dx = Math.floor(Math.random() * (this.shakeIntensity * 2 + 1)) - this.shakeIntensity;
                    this.dy = Math.floor(Math.random() * (this.shakeIntensity * 2 + 1)) - this.shakeIntensity;
                    this.shakeDuration--;
                    if (this.shakeDuration === 0) this.shakeIntensity = 0;
                } else {
                    this.dx = 0;
                    this.dy = 0;
                }
            }
        };

        // Particle Manager
        const particleManager = {
            particles: [],
            wakes: [],
            spawnSmoke(x, y, size = 15, count = 6) {
                for (let i = 0; i < count; i++) {
                    let ang = Math.random() * Math.PI * 2;
                    let mag = Math.random() * 1.5 + 0.5;
                    this.particles.push({
                        type: 'smoke', x: x, y: y,
                        vx: Math.cos(ang) * mag, vy: Math.sin(ang) * mag,
                        radius: Math.random() * (size * 0.6) + (size * 0.4),
                        alpha: 220, decay: Math.random() * 3 + 2
                    });
                }
            },
            spawnSplinterExplosion(x, y) {
                this.spawnSmoke(x, y, 22, 12);
                for (let i = 0; i < 25; i++) {
                    let ang = Math.random() * Math.PI * 2;
                    let mag = Math.random() * 3 + 1.5;
                    this.particles.push({
                        type: 'splinter', x: x, y: y,
                        vx: Math.cos(ang) * mag, vy: Math.sin(ang) * mag,
                        radius: Math.random() * 2 + 1.5,
                        alpha: 255, decay: Math.random() * 4 + 4
                    });
                }
            },
            spawnWake(x, y, radius) {
                if (Math.random() < 0.4) {
                    this.wakes.push({ x: x, y: y, radius: radius * 0.5, alpha: 150 });
                }
            },
            update() {
                for (let i = this.wakes.length - 1; i >= 0; i--) {
                    let w = this.wakes[i];
                    w.radius += 0.3;
                    w.alpha -= 3;
                    if (w.alpha <= 0) this.wakes.splice(i, 1);
                }
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    let p = this.particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.type === 'smoke') {
                        p.vx *= 0.97; p.vy *= 0.97;
                        p.radius += 0.15;
                    }
                    p.alpha -= p.decay;
                    if (p.alpha <= 0) this.particles.splice(i, 1);
                }
            },
            drawWakes(ctx, cam) {
                ctx.save();
                for (let w of this.wakes) {
                    ctx.strokeStyle = `rgba(200, 220, 240, ${w.alpha / 255})`;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(w.x + cam.dx, w.y + cam.dy, w.radius, 0, Math.PI * 2);
                    ctx.stroke();
                }
                ctx.restore();
            },
            drawTopLayers(ctx, cam) {
                ctx.save();
                for (let p of this.particles) {
                    let alpha = Math.max(0, Math.min(255, p.alpha)) / 255;
                    if (p.type === 'smoke') {
                        ctx.fillStyle = `rgba(220, 220, 220, ${alpha})`;
                    } else if (p.type === 'splinter') {
                        ctx.fillStyle = `rgba(230, 140, 40, ${alpha})`;
                    }
                    ctx.beginPath();
                    ctx.arc(p.x + cam.dx, p.y + cam.dy, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        };

        // CannonBall Class
        class CannonBall {
            constructor(x, y, vx, vy, faction) {
                this.x = x; this.y = y;
                this.vx = vx; this.vy = vy;
                this.faction = faction;
                this.age = 0; this.maxAge = 70;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.age++;
            }
            draw(ctx, cam) {
                ctx.fillStyle = '#0f0f0f';
                ctx.beginPath();
                ctx.arc(this.x + cam.dx, this.y + cam.dy, 4, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Ship Class
        class Ship {
            constructor(x, y, faction, name) {
                this.x = x; this.y = y;
                this.faction = faction;
                this.name = name;
                this.angle = faction === 'French' ? 0 : Math.PI;
                this.speed = 0;
                this.maxSpeed = 2.2;
                this.turnSpeed = 0.025;
                this.health = 450;
                this.maxHealth = 450;
                this.selected = false;
                this.isSunk = false;
                this.reloadTimer = 0;
                this.reloadCooldown = 150;
                this.length = 50;
                this.width = 18;
                this.targetX = null;
                this.targetY = null;
            }
            navigateTowards(tx, ty) {
                this.targetX = tx;
                this.targetY = ty;
            }
            updatePhysics() {
                if (this.isSunk) return;

                if (this.targetX !== null && this.targetY !== null) {
                    let dx = this.targetX - this.x;
                    let dy = this.targetY - this.y;
                    let dist = Math.hypot(dx, dy);
                    if (dist > 30) {
                        let targetAngle = Math.atan2(dy, dx);
                        let angleDiff = (targetAngle - this.angle + Math.PI) % (Math.PI * 2) - Math.PI;
                        if (angleDiff > 0) this.angle += Math.min(this.turnSpeed, angleDiff);
                        else this.angle += Math.max(-this.turnSpeed, angleDiff);
                        this.speed = Math.min(this.speed + 0.03, this.maxSpeed);
                    } else {
                        this.speed *= 0.95;
                        this.targetX = null;
                        this.targetY = null;
                    }
                }

                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;

                if (this.speed > 0.4) {
                    let bx = this.x - Math.cos(this.angle) * (this.length * 0.4);
                    let by = this.y - Math.sin(this.angle) * (this.length * 0.4);
                    particleManager.spawnWake(bx, by, this.width);
                }
                if (this.reloadTimer > 0) this.reloadTimer--;
            }
            fireBroadside(side, ballPool) {
                if (this.isSunk || this.reloadTimer > 0) return;
                this.reloadTimer = this.reloadCooldown;
                camera.triggerShake(8, 12);

                let fireAngle = this.angle + (side === 'left' ? Math.PI / 2 : -Math.PI / 2);

                for (let i = -2; i <= 2; i++) {
                    let offset = i * 8;
                    let hx = this.x + Math.cos(this.angle) * offset;
                    let hy = this.y + Math.sin(this.angle) * offset;
                    let spread = fireAngle + (Math.random() * 0.16 - 0.08);
                    let bSpeed = Math.random() * 1.5 + 6.0;
                    let vx = Math.cos(spread) * bSpeed;
                    let vy = Math.sin(spread) * bSpeed;

                    ballPool.push(new CannonBall(hx, hy, vx, vy, this.faction));
                    particleManager.spawnSmoke(hx + Math.cos(fireAngle) * 8, hy + Math.sin(fireAngle) * 8, 10, 4);
                }
            }
            draw(ctx, cam) {
                let px = this.x + cam.dx;
                let py = this.y + cam.dy;

                if (this.isSunk) {
                    ctx.save();
                    ctx.translate(px, py);
                    ctx.rotate(this.angle);
                    ctx.fillStyle = 'rgba(20, 20, 20, 0.47)';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, this.length / 2, this.width / 2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                    return;
                }

                if (this.selected) {
                    ctx.save();
                    ctx.strokeStyle = CLR_GOLD;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.ellipse(px, py, 40, 25, 0, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }

                // Render Hull
                ctx.save();
                ctx.translate(px, py);
                ctx.rotate(this.angle);

                ctx.fillStyle = CLR_WOOD;
                ctx.beginPath();
                ctx.moveTo(this.length / 2, 0);
                ctx.lineTo(this.length / 4, -this.width / 2);
                ctx.lineTo(-this.length / 2, -this.width / 2);
                ctx.lineTo(-this.length / 2, this.width / 2);
                ctx.lineTo(this.length / 4, this.width / 2);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = '#281e14';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Sails
                ctx.strokeStyle = CLR_SAIL;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(-10, -this.width / 2 + 2);
                ctx.lineTo(-10, this.width / 2 - 2);
                ctx.moveTo(10, -this.width / 2 + 4);
                ctx.lineTo(10, this.width / 2 - 4);
                ctx.stroke();

                // Flag
                ctx.fillStyle = this.faction === 'French' ? CLR_FRENCH : CLR_BRITISH;
                ctx.fillRect(-this.length / 2 - 4, -3, 6, 6);

                ctx.restore();

                // Health bar
                let barW = 40;
                let barX = px - barW / 2;
                let barY = py - 30;
                let hpPct = Math.max(0, this.health / this.maxHealth);
                ctx.fillStyle = '#280a0a';
                ctx.fillRect(barX, barY, barW, 4);
                ctx.fillStyle = '#28dc28';
                ctx.fillRect(barX, barY, Math.floor(barW * hpPct), 4);
            }
        }

        // Setup Entities
        const playerFleet = [
            new Ship(300, 250, 'French', "L'Orient (Flagship)"),
            new Ship(300, 450, 'French', "Le Redoutable"),
            new Ship(300, 650, 'French', "Le Bucentaure")
        ];

        const enemyFleet = [
            new Ship(1140, 280, 'British', "HMS Victory"),
            new Ship(1140, 480, 'British', "HMS Royal Sovereign"),
            new Ship(1140, 680, 'British', "HMS Britannia")
        ];

        const cannonBalls = [];

        // UI & Shop Data System
        const uiSystem = {
            goldDoubloons: 350,
            menuButtons: {
                play: { x: 0, y: 0, w: 300, h: 50 },
                shop: { x: 0, y: 0, w: 300, h: 50 },
                quit: { x: 0, y: 0, w: 300, h: 50 }
            },
            shopItems: [
                { name: "Upgrade Hull Armor", cost: 150, bought: false },
                { name: "Heavy Powder Charges", cost: 200, bought: false },
                { name: "Elite Royal Helmsman", cost: 100, bought: false }
            ],
            updateButtonLayout() {
                const cx = canvas.width / 2;
                const cy = canvas.height / 2;
                this.menuButtons.play.x = cx - 150; this.menuButtons.play.y = cy - 40;
                this.menuButtons.shop.x = cx - 150; this.menuButtons.shop.y = cy + 30;
                this.menuButtons.quit.x = cx - 150; this.menuButtons.quit.y = cy + 100;
            },
            drawMainMenu(ctx) {
                this.updateButtonLayout();
                ctx.fillStyle = '#0a1622';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                for (let i = 0; i < canvas.width; i += 80) {
                    ctx.strokeStyle = '#0e1e2e';
                    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
                }

                ctx.textAlign = 'center';
                ctx.fillStyle = CLR_GOLD;
                ctx.font = 'bold 42px Georgia';
                ctx.fillText("NAPOLEON: EMPIRE AT SEA", canvas.width / 2, canvas.height / 2 - 160);

                ctx.fillStyle = CLR_WHITE;
                ctx.font = 'italic 20px Georgia';
                ctx.fillText("Tactical Command and Naval Broadside Simulation", canvas.width / 2, canvas.height / 2 - 110);

                ctx.fillStyle = CLR_GOLD;
                ctx.font = 'bold 14px Courier';
                ctx.fillText(`👑 IMPERIAL TREASURY: ${this.goldDoubloons} DOUBLOONS`, canvas.width / 2, canvas.height / 2 - 75);

                for (let key in this.menuButtons) {
                    let btn = this.menuButtons[key];
                    let isHover = mouseX >= btn.x && mouseX <= btn.x + btn.w && mouseY >= btn.y && mouseY <= btn.y + btn.h;
                    ctx.fillStyle = isHover ? '#283c50' : '#192837';
                    ctx.fillRect(btn.x, btn.y, btn.w, btn.h);
                    ctx.strokeStyle = isHover ? CLR_GOLD : CLR_HUD_BORDER;
                    ctx.strokeRect(btn.x, btn.y, btn.w, btn.h);

                    ctx.fillStyle = CLR_WHITE;
                    ctx.font = 'italic 20px Georgia';
                    ctx.fillText(key.toUpperCase(), btn.x + btn.w / 2, btn.y + btn.h / 2 + 7);
                }
            },
            drawShopMenu(ctx) {
                ctx.fillStyle = '#0c121a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.strokeStyle = CLR_HUD_BORDER;
                ctx.lineWidth = 2;
                ctx.strokeRect(50, 50, canvas.width - 100, canvas.height - 100);

                ctx.textAlign = 'left';
                ctx.fillStyle = CLR_GOLD;
                ctx.font = 'bold 36px Georgia';
                ctx.fillText("IMPERIAL ADMIRALTY ADMIRAL SHOP", 100, 110);

                ctx.fillStyle = CLR_WHITE;
                ctx.font = 'bold 14px Courier';
                ctx.fillText(`CURRENT BALANCE: ${this.goldDoubloons} DOUBLOONS`, 100, 160);

                for (let i = 0; i < this.shopItems.length; i++) {
                    let item = this.shopItems[i];
                    let bx = 100, by = 220 + i * 80, bw = canvas.width - 200, bh = 60;
                    let isHover = mouseX >= bx && mouseX <= bx + bw && mouseY >= by && mouseY <= by + bh;

                    ctx.fillStyle = isHover ? '#202d3e' : '#16202d';
                    ctx.fillRect(bx, by, bw, bh);
                    ctx.strokeStyle = item.bought ? CLR_GOLD : CLR_HUD_BORDER;
                    ctx.strokeRect(bx, by, bw, bh);

                    let status = item.bought ? "ACQUIRED" : `BUY: ${item.cost} GOLD`;
                    ctx.fillStyle = CLR_WHITE;
                    ctx.fillText(`${item.name} - Status: ${status}`, 130, by + 35);
                }

                let escX = 100, escY = canvas.height - 120, escW = 240, escH = 45;
                ctx.fillStyle = '#641e1e';
                ctx.fillRect(escX, escY, escW, escH);
                ctx.fillStyle = CLR_WHITE;
                ctx.textAlign = 'center';
                ctx.fillText("[ESC] BACK TO MENU", escX + escW / 2, escY + escH / 2 + 5);
            },
            drawCombatHud(ctx, selectedShip, activeFr, activeBr) {
                const hH = 140;
                const hY = canvas.height - hH;
                ctx.fillStyle = CLR_HUD_BG;
                ctx.fillRect(0, hY, canvas.width, hH);
                ctx.strokeStyle = CLR_HUD_BORDER;
                ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(0, hY); ctx.lineTo(canvas.width, hY); ctx.stroke();

                ctx.fillStyle = '#182028';
                ctx.fillRect(canvas.width - 360, hY + 20, 330, 45);
                ctx.strokeStyle = CLR_GOLD;
                ctx.lineWidth = 1;
                ctx.strokeRect(canvas.width - 360, hY + 20, 330, 45);

                ctx.textAlign = 'left';
                ctx.fillStyle = CLR_GOLD;
                ctx.font = 'bold 14px Courier';
                ctx.fillText(`👑 TREASURY COINS: ${this.goldDoubloons} DOUBLOONS`, canvas.width - 340, hY + 47);

                ctx.fillStyle = '#508ce1';
                ctx.fillText(`FRENCH SHIPS FORCE: ${activeFr} LIVE`, 40, hY + 35);
                ctx.fillStyle = '#f55050';
                ctx.fillText(`BRITISH FLEET TARGET: ${activeBr} LIVE`, 40, hY + 55);

                if (selectedShip) {
                    ctx.fillStyle = CLR_WHITE;
                    ctx.fillText(`COMMANDING FLAGSHIP: ${selectedShip.name} | RELOAD COOLDOWN: ${selectedShip.reloadTimer} FRAMES`, 40, hY + 95);
                    ctx.fillStyle = CLR_GOLD;
                    ctx.fillText(`[Q] FIRE LEFT BROADSIDE  |  [E] FIRE RIGHT BROADSIDE  |  [R-CLICK] NAVIGATE STEER`, 40, hY + 118);
                } else {
                    ctx.fillStyle = '#969696';
                    ctx.fillText("LEFT-CLICK SHIP VESSEL TO ASSUME DIRECT FLEET SECTOR COMMAND.", 40, hY + 95);
                }
            }
        };

        // User Inputs Tracking
        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        window.addEventListener('mousedown', (e) => {
            if (gameState === 'MENU') {
                if (mouseX >= uiSystem.menuButtons.play.x && mouseX <= uiSystem.menuButtons.play.x + uiSystem.menuButtons.play.w &&
                    mouseY >= uiSystem.menuButtons.play.y && mouseY <= uiSystem.menuButtons.play.y + uiSystem.menuButtons.play.h) {
                    gameState = 'PLAY';
                } else if (mouseX >= uiSystem.menuButtons.shop.x && mouseX <= uiSystem.menuButtons.shop.x + uiSystem.menuButtons.shop.w &&
                           mouseY >= uiSystem.menuButtons.shop.y && mouseY <= uiSystem.menuButtons.shop.y + uiSystem.menuButtons.shop.h) {
                    gameState = 'SHOP';
                } else if (mouseX >= uiSystem.menuButtons.quit.x && mouseX <= uiSystem.menuButtons.quit.x + uiSystem.menuButtons.quit.w &&
                           mouseY >= uiSystem.menuButtons.quit.y && mouseY <= uiSystem.menuButtons.quit.y + uiSystem.menuButtons.quit.h) {
                    window.close();
                }
            } else if (gameState === 'SHOP') {
                for (let i = 0; i < uiSystem.shopItems.length; i++) {
                    let bx = 100, by = 220 + i * 80, bw = canvas.width - 200, bh = 60;
                    if (mouseX >= bx && mouseX <= bx + bw && mouseY >= by && mouseY <= by + bh && !uiSystem.shopItems[i].bought) {
                        if (uiSystem.goldDoubloons >= uiSystem.shopItems[i].cost) {
                            uiSystem.goldDoubloons -= uiSystem.shopItems[i].cost;
                            uiSystem.shopItems[i].bought = true;
                            if (i === 0) {
                                for (let s of playerFleet) { s.maxHealth += 150; s.health += 150; }
                            }
                        }
                    }
                }
                let escX = 100, escY = canvas.height - 120, escW = 240, escH = 45;
                if (mouseX >= escX && mouseX <= escX + escW && mouseY >= escY && mouseY <= escY + escH) {
                    gameState = 'MENU';
                }
            } else if (gameState === 'PLAY') {
                if (mouseY < canvas.height - 140) {
                    if (e.button === 0) { // Left click
                        selectedShip = null;
                        for (let s of playerFleet) {
                            s.selected = false;
                            if (Math.hypot(s.x - mouseX, s.y - mouseY) < 45) {
                                s.selected = true;
                                selectedShip = s;
                            }
                        }
                    }
                }
            }
        });

        // Block Right Click Context Menu natively
        window.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            if (gameState === 'PLAY' && selectedShip && mouseY < canvas.height - 140) {
                selectedShip.navigateTowards(mouseX, mouseY);
            }
        });

        window.addEventListener('keydown', (e) => {
            if (gameState === 'SHOP' && e.key === 'Escape') gameState = 'MENU';
            if (gameState === 'PLAY' && selectedShip) {
                if (e.key === 'q' || e.key === 'Q') selectedShip.fireBroadside('left', cannonBalls);
                if (e.key === 'e' || e.key === 'E') selectedShip.fireBroadside('right', cannonBalls);
            }
        });

        // Core Loop Lifecycle
        function loop() {
            let frCount = playerFleet.filter(s => !s.isSunk).length;
            let brCount = enemyFleet.filter(s => !s.isSunk).length;

            if (gameState === 'PLAY') {
                camera.update();
                particleManager.update();

                for (let ps of playerFleet) ps.updatePhysics();

                // Enemy AI Routine Engine Matrix
                for (let es of enemyFleet) {
                    if (es.isSunk) continue;
                    es.updatePhysics();

                    let livePlayers = playerFleet.filter(p => !p.isSunk);
                    if (livePlayers.length > 0) {
                        let closest = livePlayers[0];
                        let minDist = Math.hypot(closest.x - es.x, closest.y - es.y);
                        for (let p of livePlayers) {
                            let d = Math.hypot(p.x - es.x, p.y - es.y);
                            if (d < minDist) { minDist = d; closest = p; }
                        }
                        es.navigateTowards(closest.x, closest.y);

                        if (minDist < 280 && es.reloadTimer === 0) {
                            let angToTarget = Math.atan2(closest.y - es.y, closest.x - es.x);
                            let diff = (angToTarget - es.angle + Math.PI) % (Math.PI * 2) - Math.PI;
                            if (Math.abs(diff - Math.PI / 2) < 0.3) es.fireBroadside('left', cannonBalls);
                            else if (Math.abs(diff + Math.PI / 2) < 0.3) es.fireBroadside('right', cannonBalls);
                        }
                    }
                }

                // Shell/Projectile Tracking Loops
                for (let i = cannonBalls.length - 1; i >= 0; i--) {
                    let ball = cannonBalls[i];
                    ball.update();

                    let targets = ball.faction === 'French' ? enemyFleet : playerFleet;
                    let hitDetected = false;

                    for (let target of targets) {
                        if (!target.isSunk && Math.hypot(target.x - ball.x, target.y - ball.y) < 22) {
                            let dmg = Math.floor(Math.random() * 30) + 35;
                            if (uiSystem.shopItems[1].bought && ball.faction === 'French') {
                                dmg = Math.floor(dmg * 1.35);
                            }
                            target.health -= dmg;
                            particleManager.spawnSplinterExplosion(ball.x, ball.y);
                            camera.triggerShake(4, 6);
                            hitDetected = true;

                            if (target.health <= 0) {
                                target.isSunk = true;
                                if (ball.faction === 'French') {
                                    uiSystem.goldDoubloons += Math.floor(Math.random() * 40) + 80;
                                }
                            }
                            break;
                        }
                    }

                    if (hitDetected || ball.age >= ball.maxAge) {
                        if (!hitDetected) particleManager.spawnSmoke(ball.x, ball.y, 5, 2);
                        cannonBalls.splice(i, 1);
                    }
                }
            }

            // RENDERING DISPATCH STAGE
            if (gameState === 'MENU') {
                uiSystem.drawMainMenu(ctx);
            } else if (gameState === 'SHOP') {
                uiSystem.drawShopMenu(ctx);
            } else if (gameState === 'PLAY') {
                ctx.fillStyle = CLR_OCEAN;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Grid background layers
                for (let gx = 0; gx < canvas.width; gx += 80) {
                    for (let gy = 0; gy < canvas.height - 140; gy += 80) {
                        ctx.fillStyle = CLR_WAVE;
                        ctx.beginPath();
                        ctx.arc(gx + camera.dx, gy + camera.dy, 2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                particleManager.drawWakes(ctx, camera);
                for (let s of playerFleet.concat(enemyFleet)) s.draw(ctx, camera);
                for (let b of cannonBalls) b.draw(ctx, camera);
                particleManager.drawTopLayers(ctx, camera);

                uiSystem.drawCombatHud(ctx, selectedShip, frCount, brCount);
            }

            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
